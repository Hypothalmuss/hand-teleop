# Robot workspace box in base_link (m)
box:
  x: [0.30, 0.60]
  y: [-0.30, 0.30]
  z: [0.02, 0.35]
# Calibrated right-hand ranges (written by scripts/calibrate_workspace.py)
hand_range:
  u: [0.2327, 0.7703]           # mirrored normalized image x of landmark 9
  v: [0.2342, 0.8962]           # 1 - normalized image y of landmark 9
  d: [5.6330, 10.4253]          # 1 / palm_scale (palm_scale in image-width units)
axis_map: {u: y, v: z, d: x}
# sign -1 reverses an axis: d grows with distance from the webcam, and a hand closer to the
# webcam moves the TCP farther from the base (towards the front camera).
sign: {x: -1.0, y: 1.0, z: 1.0}
gain: {x: 1.0, y: 1.0, z: 1.0}
max_target_speed: 0.3     # m/s
absent_hold_s: 0.3
reset_jump_m: 0.05          # EE jump between hand updates treated as a sim reset (re-anchor)
gripper:
  pinch_closed: 0.089      # calibrated left-hand pinch range
  pinch_open: 1.322
  rate_limit: 2.0         # per second

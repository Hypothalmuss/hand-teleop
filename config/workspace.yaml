# Robot workspace box in base_link (m)
box:
  x: [0.30, 0.60]
  y: [-0.30, 0.30]
  z: [0.02, 0.35]
# Calibrated hand ranges (written by scripts/calibrate_workspace.py)
hand_range:
  u: [0.2, 0.8]           # mirrored normalized image x of landmark 9
  v: [0.2, 0.8]           # 1 - normalized image y of landmark 9
  d: [5.0, 10.0]          # 1 / palm_scale
  pinch: [0.25, 1.0]
axis_map: {u: y, v: z, d: x}
sign: {x: 1.0, y: 1.0, z: 1.0}
gain: {x: 1.0, y: 1.0, z: 1.0}
max_target_speed: 0.5     # m/s
absent_hold_s: 0.3
gripper:
  pinch_closed: 0.25
  pinch_open: 1.0
  rate_limit: 2.0         # per second

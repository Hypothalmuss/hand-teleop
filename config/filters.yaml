camera: {index: 0, width: 640, height: 480, fourcc: MJPG, buffer_size: 1}
# One Euro parameters are in pixel units (value_scale = image width), the standard tuning space.
landmarks: {min_cutoff: 1.0, beta: 0.007, d_cutoff: 1.0, value_scale: 640}
palm_scale: {min_cutoff: 0.5, beta: 0.007, d_cutoff: 1.0, value_scale: 640}
gestures:
  # straightness = chord/arc per finger (length-invariant); extension = |tip - mcp| / palm_scale
  # (plan formula; its 1.3 open threshold is unreachable: measured 0.5-0.9 on open hands).
  feature: straightness
  thresholds:
    straightness: {open: 0.85, fist: 0.6}
    extension: {open: 1.3, fist: 0.9}
  debounce_frames: 3
missing_frames: 5
swap_handedness: false
publish_raw: false
